<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>DDTank Clássico - Servidor Local Privado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #flashContent {
            width: 1000px;
            height: 600px;
            background: #0f172a;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        embed, object {
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="flashContent">
        <embed 
            src="/flash/Loading.swf" 
            width="1000" 
            height="600" 
            quality="high" 
            bgcolor="#000000" 
            allowScriptAccess="always" 
            allowFullScreen="true" 
            type="application/x-shockwave-flash" 
            pluginspage="http://www.macromedia.com/go/getflashplayer" 
            flashvars="user=Admin&amp;key=master_token&amp;v=205&amp;rand=998877&amp;config=http://127.0.0.1:8080/config.xml&amp;site=http://127.0.0.1:8080/">
    </div>
</body>
</html>
