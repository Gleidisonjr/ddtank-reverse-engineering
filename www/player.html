<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>DDTank Clássico - Servidor Local Privado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #flashContent {
            width: 1000px;
            height: 600px;
            background: #000000;
            position: relative;
        }
        embed, object {
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="flashContent">
        <object classid="clsid:d27cdb6e-ae6d-11cf-96b8-444553540000" width="1000" height="600" id="DDTank">
            <param name="movie" value="/flash/DDT_Loading.swf" />
            <param name="quality" value="high" />
            <param name="bgcolor" value="#000000" />
            <param name="allowScriptAccess" value="always" />
            <param name="allowFullScreen" value="true" />
            <param name="wmode" value="direct" />
            <param name="flashvars" value="user=Admin&username=Admin&key=master_token&v=205&rand=998877&config=http://127.0.0.1:8080/config.xml&site=http://127.0.0.1:8080/" />
            <embed 
                src="/flash/DDT_Loading.swf"
                width="1000" 
                height="600" 
                quality="high" 
                bgcolor="#000000" 
                allowScriptAccess="always" 
                allowFullScreen="true" 
                wmode="direct"
                type="application/x-shockwave-flash" 
                pluginspage="http://www.macromedia.com/go/getflashplayer" 
                flashvars="user=Admin&username=Admin&key=master_token&v=205&rand=998877&config=http://127.0.0.1:8080/config.xml&site=http://127.0.0.1:8080/">
        </object>
    </div>
</body>
</html>
